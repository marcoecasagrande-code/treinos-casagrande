<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3c123"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Treinos">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-shim.js"></script>
</head><body>
<title>Treinos Casagrande</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de uma coluna para o celular; cabeçalho fixo no topo, barra de abas fixa embaixo, cartões de exercício com linhas de série. */
:root{
  --bg:#eef0ee; --surface:#ffffff; --surface-2:#f5f6f4; --ink:#14181d; --muted:#5f6772; --line:#d9ddd9;
  --accent:#1d4fd6; --accent-ink:#ffffff; --accent-soft:#e3eafc;
  --done:#16804a; --done-soft:#dff2e7; --warn:#b4551b; --danger:#c22f2f; --danger-soft:#fbe5e3;
  --plate-red:#d23a2c; --plate-blue:#1d4fd6; --plate-yellow:#e2b21c; --plate-green:#2b8a46;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius:12px;
  --p2:#d9711c; --fig-skin:#e9ddd2; --fig-skin-far:#c9bcb1; --fig-shirt:#1d4fd6; --fig-shorts:#3b4048; --fig-shorts-far:#2c3036; --fig-shoe:#5b616a; --fig-hair:#3b3530; --fig-line:#4a4f57;
  --mus-pri:#d8352a; --mus-sec:#f09a7e;
  --map-base:#d6dadf; --map-idle:#bcc3cb; --map-sec:#f2a65a;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101316; --surface:#1a1e23; --surface-2:#22272d; --ink:#eef1f4; --muted:#9aa3ad; --line:#2e343b;
  --accent:#6e98ff; --accent-ink:#0b1430; --accent-soft:#1f2b4a;
  --done:#4cc486; --done-soft:#173326; --warn:#f0a06a; --danger:#ff7b72; --danger-soft:#3a1d1d; --p2:#f2a65a; --fig-shirt:#4f7cf0; --fig-line:#07090b; --map-base:#353b43; --map-idle:#4b535d; --map-sec:#e8964a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101316; --surface:#1a1e23; --surface-2:#22272d; --ink:#eef1f4; --muted:#9aa3ad; --line:#2e343b;
  --accent:#6e98ff; --accent-ink:#0b1430; --accent-soft:#1f2b4a;
  --done:#4cc486; --done-soft:#173326; --warn:#f0a06a; --danger:#ff7b72; --danger-soft:#3a1d1d; --p2:#f2a65a; --fig-shirt:#4f7cf0; --fig-line:#07090b; --map-base:#353b43; --map-idle:#4b535d; --map-sec:#e8964a; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body.resting{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.seg.modo{flex:1 1 200px;min-width:200px;max-width:260px}
.seg.modo button{min-height:36px;font-size:13px;padding:0 6px;white-space:nowrap}
.seg.modo button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
@media (max-width:420px){.seg.modo{width:100%}}
.hero{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--fc,var(--accent));border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:12px}
.hero-top{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center}
.hero-list{display:grid;gap:6px}
.hero-ex{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:4px 10px 4px 4px}
.hero-ex b{display:block;font-size:14px}
.hero-ex>span:last-child{max-width:42%;text-align:right;line-height:1.3}
.btn.go{min-height:56px;font-size:18px}
.brand{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
.brand span{color:var(--accent)}
.today{color:var(--muted);font-size:13px}
.crono{display:inline-flex;align-items:center;gap:7px;border-radius:999px;background:var(--done);color:#fff;font-family:var(--display);font-weight:800;font-size:20px;line-height:1;padding:7px 12px;min-height:36px;font-variant-numeric:tabular-nums;white-space:nowrap}
.crono i{width:8px;height:8px;border-radius:50%;background:#fff;animation:cronoPulse 1.2s ease-in-out infinite}
@keyframes cronoPulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.crono i{animation:none}}

main{max-width:640px;margin:0 auto;padding-block:16px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.05;margin:0;text-wrap:balance;text-transform:uppercase;letter-spacing:.01em}
h3{font-size:16px;margin:0}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:#fff}
.btn.small{min-height:36px;padding:6px 10px;font-size:13px}
.btn.block{width:100%}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;font-weight:700;flex:none}

.banner{background:var(--accent-soft);border-radius:var(--radius);padding:12px 14px;font-size:14px}
.banner.warn{background:var(--danger-soft);color:var(--ink)}

/* seleção de ficha */
.ficha-pick{display:grid;gap:10px}
.pick{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.pick:active{border-color:var(--accent)}
.letter{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:28px;color:#fff;box-shadow:inset 0 0 0 5px rgba(255,255,255,.18)}
.pick .meta{min-width:0}
.pick .meta b{display:block;font-size:16px}
.pick .meta small{color:var(--muted);display:block}
.chip{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 8px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pick-wrap{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.pick-wrap .pick{border:0;border-radius:0}
.pick-wrap.open{border-color:var(--accent)}
.mode-pick{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
.btn.mode{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;min-height:64px}
.btn.mode small{font-weight:500;font-size:12px;opacity:.85}
.chip.today{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chip.ok{background:var(--done-soft);color:var(--done);border-color:transparent}

/* treino ativo */
.session-head{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--done);border-radius:99px;transition:width .3s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat b{font-family:var(--display);font-size:24px;font-weight:700;display:block;line-height:1}
.stat small{color:var(--muted);font-size:12px}

.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.ex.complete{border-color:var(--done)}
.ex-head{padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-head .t{min-width:0}
.ex-head h3{font-size:17px}
.ex-head .target{color:var(--muted);font-size:13px}
.ex-head .last{font-size:12px;color:var(--muted);margin-top:2px}
.ex-note{padding:0 14px 10px;font-size:13px;color:var(--muted)}
.sets{border-top:1px solid var(--line)}
.set{display:grid;grid-template-columns:18px 1fr 1fr 46px 44px;gap:5px;align-items:center;padding:8px 10px 8px 14px;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set.done{background:var(--done-soft)}
.set .n{font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted)}
.field{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;min-width:0}
.field button{border:0;background:var(--surface-2);width:26px;height:44px;font-weight:700;flex:none}
.field input{border:0;background:transparent;width:100%;min-width:0;text-align:center;font-weight:700;font-size:17px;padding:0;height:44px;font-variant-numeric:tabular-nums}
.field .u{font-size:11px;color:var(--muted);padding-right:6px}
.check{width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center}
.check svg{width:22px;height:22px;stroke:var(--muted)}
.set.done .check{background:var(--done);border-color:var(--done)}
.set.done .check svg{stroke:#fff}
.set-labels{display:grid;grid-template-columns:18px 1fr 1fr 46px 44px;gap:5px;padding:6px 10px 0 14px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ex-foot{display:flex;gap:8px;padding:8px 14px 12px;flex-wrap:wrap}

/* descanso */
#rest{pointer-events:none;position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:25;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.rest-in{pointer-events:auto;max-width:640px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.rest-in .time{font-family:var(--display);font-size:30px;font-weight:800;min-width:72px;font-variant-numeric:tabular-nums}
.rest-in .bar{flex:1;height:6px;background:rgba(127,127,127,.35);border-radius:99px;overflow:hidden}
.rest-in .bar i{display:block;height:100%;background:var(--plate-yellow)}
.rest-in button{background:transparent;color:inherit;border:1px solid rgba(127,127,127,.5);border-radius:8px;padding:6px 10px;font-weight:600;font-size:13px}

/* abas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:26;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:600}
.tabs a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2}
.tabs a[aria-current="page"]{color:var(--accent)}

/* editor de fichas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.ficha-list{display:grid;gap:10px}
.ficha-row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
.ficha-row .letter{width:44px;height:44px;font-size:22px}
.ficha-row .meta{min-width:0}
.ficha-row .meta small{display:block;color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
label.f input,label.f textarea,label.f select{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;font-size:16px;font-weight:500;color:var(--ink);min-height:44px;width:100%}
label.f textarea{min-height:60px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:420px){.grid4{grid-template-columns:1fr 1fr}}
.ex-edit{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.ex-edit .row .grow{flex:1;min-width:0}
.colors{display:flex;gap:8px}
.colors button{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.colors button[aria-pressed="true"]{border-color:var(--ink)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--danger-soft);border-radius:10px;padding:10px}

/* histórico */
.hist{display:grid;gap:10px}
.hist-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.hist-item > button{width:100%;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;background:transparent;border:0;padding:12px 14px}
.date{text-align:center;line-height:1}
.date b{font-family:var(--display);font-size:26px;font-weight:800;display:block}
.date small{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
.hist-detail{border-top:1px solid var(--line);padding:10px 14px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.hist-detail .exl{display:flex;justify-content:space-between;gap:10px}
.hist-detail .exl span:last-child{color:var(--muted);text-align:right}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;max-width:calc(100% - 32px)}

/* animações de execução */
.anim-btn{flex:none;width:68px;height:68px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);padding:3px;display:block}
.anim-btn:active{border-color:var(--accent)}
svg.anim{width:100%;height:100%;display:block;overflow:visible}
svg.anim .limb{fill:none;stroke:var(--ink);stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}
svg.anim .ghost{opacity:.4}
svg.anim .head{fill:var(--ink)}
svg.anim .eq{stroke:var(--muted);stroke-width:2.5;fill:none;stroke-linecap:round;opacity:.8}
svg.anim .eq-f{fill:var(--muted);opacity:.55}
svg.anim .eq-soft{fill:var(--muted);opacity:.16}
svg.anim .load{fill:#41474f}
svg.anim .hub{fill:var(--surface)}
svg.anim .bar{stroke:#4b515a;stroke-width:3.2;stroke-linecap:round;fill:none}
svg.anim .cable{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:2 2;fill:none}
svg.anim .ground{stroke:var(--line);stroke-width:2}
.ex-head{display:grid !important;grid-template-columns:68px 1fr auto;align-items:start}
.demo{position:fixed;inset:0;z-index:50;background:rgba(10,12,15,.55);display:flex;align-items:flex-end;justify-content:center;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.demo-in{background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
@media (min-width:600px){.demo{align-items:center}.demo-in{border-radius:18px}}
.demo-stage{background:var(--surface-2);border-radius:14px;aspect-ratio:1/1;width:100%;max-width:320px;max-height:42vh;margin:0 auto;padding:10px}
.demo ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.anim-pick{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:end}
.anim-pick .anim-btn{width:52px;height:52px}
/* tabata */
.group-h{display:flex;align-items:baseline;justify-content:space-between;margin-top:4px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;min-height:40px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tb{--ph:var(--plate-yellow);background:var(--ph);color:#fff;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;transition:background-color .7s ease}
.tb.work{--ph:#f3c123;color:#1d1d1f}
.tb.work .tb-phase,.tb.work .tb-time{text-shadow:none!important}.tb.work .tb-bar{background:rgba(0,0,0,.15)}.tb.work .tb-bar i{background:#1d1d1f}.tb.work .tb-meta{background:rgba(0,0,0,.1)}
.tb-wrap>*,.tb-side>*{min-width:0}
.tb{width:100%;min-width:0;box-sizing:border-box}
.tb-top span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-mid>*{min-width:0}
.tb-ex,.tb-next{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-phase{overflow:hidden;text-overflow:ellipsis}
.tb.work .tb-phase,.tb.work .tb-time{text-shadow:0 2px 6px rgba(0,0,0,.25)}
@keyframes pulsaWork{0%,100%{box-shadow:0 0 0 0 rgba(47,196,106,.7);filter:brightness(1)}50%{box-shadow:0 0 0 14px rgba(47,196,106,0);filter:brightness(1.15)}}
@media (prefers-reduced-motion:reduce){.tb.work{animation:none}} .tb.rest{--ph:#2563d9} .tb.block{--ph:#1b2f6e} .tb.prep{--ph:#4aa8e8} .tb.done{--ph:#3c4450}
.tb-top{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.tb-mid{display:grid;grid-template-columns:1fr 132px;gap:12px;align-items:center}
.tb-phase{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;text-transform:uppercase;letter-spacing:.03em}
.tb-time{font-family:var(--display);font-weight:800;font-size:84px;line-height:.95;font-variant-numeric:tabular-nums}
.tb-round{font-weight:600;font-size:15px}
.tb-stage{background:var(--surface);border-radius:12px;aspect-ratio:1/1;padding:6px}
.tb-ex{font-weight:700;font-size:18px;line-height:1.2}
.tb-next{font-size:13px;opacity:.9}
.kheart{display:inline-block;width:1.3em;height:1.3em;vertical-align:-.18em;margin-left:.25em;animation:khPop .7s cubic-bezier(.2,1.6,.4,1) both}
.kheart svg{width:100%;height:100%;overflow:visible}

const writers = {};
function save(col, id, body, delay = 0) {
  if (!S.db) return;
  const w = writers[col + "/" + id] ||= { busy: false, next: null, timer: null };
  w.next = body;
  clearTimeout(w.timer);
  w.timer = setTimeout(() => flush(col, id), delay);
}
async function flush(col, id) {
  const w = writers[col + "/" + id];
  if (!w || w.busy || !w.next) return;
  const body = w.next; w.next = null; w.busy = true;
  try { await S.db.collection(col).doc(id).set(JSON.parse(JSON.stringify(body))); }
  catch (e) {
    if (e && e.code === "unavailable") { w.next ||= body; setTimeout(() => flush(col, id), 800 + Math.random() * 800); }
    else if (e && e.code === "invalid_argument") { S.readOnly = true; toast("Você não tem permissão para alterar este app."); }
    else toast("Não foi possível salvar. Verifique a conexão.");
  } finally { w.busy = false; if (w.next) flush(col, id); }
}
const pending = (col, id) => { const w = writers[col + "/" + id]; return !!(w && (w.busy || w.next)); };

function libAdd(item) {

}

function readEditor() {

  if ($("#fe-dia")) f.dia = $("#fe-dia").value === "" ? "" : +$("#fe-dia").value;
  if (f.tipo === "tabata") { const n = (id, d) => Math.max(1, parseInt($(id)?.value) || d); f.trabalho = n("#fe-trab", 20); f.pausa = n("#fe-pausa", 10); f.rounds = n("#fe-rounds", 2); f.vezes = 1; f.descansoBloco = n("#fe-bloco", 60); const pv = parseInt($("#fe-prep")?.value); f.prep = isNaN(pv) ? 10 : Math.max(0, pv); }

  });
}

function renderHistorico() {
  const done = S.sessoes.filter(s => s.concluida);
  const cnt = {}; for (const s of done) for (const e of s.exercicios || []) if (e.nome && (e.series || []).some(x => x.feito)) cnt[e.nome.trim()] = (cnt[e.nome.trim()] || 0) + 1;
  const names = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a] || a.localeCompare(b, "pt-BR"));
  if (!S.evoEx || !names.includes(S.evoEx)) S.evoEx = names[0] || "";
  const pts = done.slice().reverse().map(s => { const e = (s.exercicios || []).find(x => key(x.nome) === key(S.evoEx)); const f = e && (e.series || []).filter(x => x.feito);
    return f && f.length ? { d: s.data, c: Math.max(...f.map(x => num(x.carga))), c2: Math.max(...f.map(x => num(x.carga2))) } : null; }).filter(Boolean).slice(-12);
  const now = new Date(); const weekStart = new Date(now); weekStart.setDate(now.getDate() - 6);
  const semana = done.filter(s => parseYmd(s.data) >= parseYmd(ymd(weekStart))).length;
  app.innerHTML = bannerHtml() + `
  <div><div class="eyebrow">Seu progresso</div><h2>Histórico</h2></div>
  <div class="card"><div class="stats num">
    <div class="stat"><b>${done.length}</b><small>treinos no total</small></div>
    <div class="stat"><b>${semana}</b><small>nos últimos 7 dias</small></div>
    <div class="stat"><b>${done[0] ? relDay(done[0].data) : "—"}</b><small>último treino</small></div></div></div>
  ${names.length ? `<div class="card stack"><label class="f">Evolução de carga<select id="evo">${names.map(n => `<option ${n === S.evoEx ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></label>${chart(pts)}</div>` : ""}
  ${done.length ? `<div class="hist">${done.map(s => { const d = parseYmd(s.data); const { v, v2, n } = volume(s);
    const dur = s.fim ? Math.round((new Date(s.fim) - new Date(s.inicio)) / 60000) : null; const open = S.openHist === s.id;
    return `<div class="hist-item"><button data-hist="${s.id}" aria-expanded="${open}">

      <span><b>${esc(s.fichaNome)}</b><br><small class="muted num">${s.tipo === "tabata" ? `Tabata · ${Math.max(0, ...(s.exercicios || []).map(e => e.rounds || 0))}/${s.rounds} sequências` : `${n} ${n === 1 ? "série" : "séries"} · ${nm("p1")} ${kg(v)} kg${v2 ? ` · ${nm("p2")} ${kg(v2)} kg` : ""}`}${dur != null ? ` · ${dur} min` : ""}</small></span>
      <span class="letter" style="width:32px;height:32px;font-size:16px;background:${esc(s.cor || COLORS[1])}">${esc(s.letra || "")}</span></button>
      ${open ? `<div class="hist-detail">${s.tipo === "tabata" ? "" : `<div class="muted" style="font-size:12px">Carga ${nm("p1")}/${nm("p2")} × repetições</div>`}${(s.exercicios || []).map(e => { if (s.tipo === "tabata") return `<div class="exl"><span>${esc(e.nome)}</span><span class="num">${e.rounds || 0}/${s.rounds} sequências</span></div>`; const f = (e.series || []).filter(x => x.feito);
        return `<div class="exl"><span>${esc(e.nome)}</span><span class="num">${f.length ? f.map(x => `${kg(num(x.carga))}${x.carga2 !== undefined && x.carga2 !== "" ? "/" + kg(num(x.carga2)) : ""}×${esc(x.reps)}`).join("  ") : "não feito"}</span></div>`; }).join("")}
        ${s.obs ? `<div class="muted">“${esc(s.obs)}”</div>` : ""}
        ${S.confirm === "del-" + s.id ? `<div class="confirm"><span>Excluir este treino do histórico?</span><button class="btn small danger solid" data-delhist-yes="${s.id}">Excluir</button><button class="btn small" data-act="confirm-no">Cancelar</button></div>`

function chart(pts) {
  if (pts.length < 2) return `<p class="muted" style="margin:0;font-size:13px">${pts.length ? `Última carga: <b class="num">${nm("p1")} ${kg(pts[0].c)} kg${pts[0].c2 ? ` · ${nm("p2")} ${kg(pts[0].c2)} kg` : ""}</b>. O gráfico aparece a partir de 2 treinos.` : "Sem registros deste exercício."}</p>`;
  const W = 320, H = 150, L = 34, R = 10, T = 14, B = 24;
  const has2 = pts.some(p => p.c2 > 0);
  const all = pts.map(p => p.c).concat(has2 ? pts.filter(p => p.c2 > 0).map(p => p.c2) : []);
  let lo = Math.min(...all), hi = Math.max(...all); if (hi === lo) { hi += 5; lo = Math.max(0, lo - 5); }
  const x = i => L + (i * (W - L - R)) / (pts.length - 1), y = c => T + (1 - (c - lo) / (hi - lo)) * (H - T - B);
  const ticks = [lo, (lo + hi) / 2, hi];
  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.c).toFixed(1)}`).join("");
  const area = line + `L${x(pts.length - 1)},${H - B}L${L},${H - B}Z`;
  const lp = pts[pts.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução de carga">
    ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${kg(Math.round(t * 10) / 10)}</text>`).join("")}
    <path d="${area}" fill="var(--accent-soft)" stroke="none"/>

      <label class="crop-zoom"><span>−</span><input type="range" min="1" max="5" step="0.01" value="1" aria-label="Zoom"><span>+</span></label>
      <div class="row crop-bts"><button class="btn ghost" data-c="0">Cancelar</button><button class="btn primary" data-c="1">Usar foto</button></div></div>`;
